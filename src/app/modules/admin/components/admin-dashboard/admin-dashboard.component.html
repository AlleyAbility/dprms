

<div class="d-flex" id="wrapper">

  <!-- Sidebar -->
  <div class=" border-right custom-sidebar" style="background-color: #363b04;" id="sidebar-wrapper" [ngClass]="status ? 'hide' : 'show'">
    <!-- Logo -->
    <div class="sidebar-logo text-center py-2">
      <img mat-card-image src="../assets/logo.png" alt="Logo" class="logo-img">
      <h1 class="text-light">ZGAMIS</h1>
      <hr class="text-light">
    </div>

    <!-- Content Area with Background Image -->
    <div class="bg-image">
      <div class="list-group-flush">
        <a routerLink="/admin/home" mat-button class="text-light">
          <i class="fa fa-dashboard icon"> Dashboard</i> 
        </a><br/>
        <a routerLink="/admin/users" mat-button class="text-light">
          <i class="fa fa-users icon">  Users</i> 
        </a><br/>
        <a routerLink="/admin/notifications" mat-button class="text-light">
          <i class="fa fa-commenting icon">  Notifications</i> 
        </a><br/>
        <a routerLink="/admin/projects" mat-button class="text-light">
          <i class="fa fa-calendar icon">  Projects</i> 
        </a><br/>
        <a routerLink="/admin/roles" mat-button class="text-light">
          <i class="fa fa-check-circle icon">  Roles</i> 
        </a>
        
      </div>
    </div>    
  </div>

    <!-- /#sidebar-wrapper -->
  
 <!-- Page Content -->

    <div class="container-fluid">

      <!-- Sidebar Toggle Button -->
      <button mat-icon-button (click)="clickEvent()" color="primary" aria-label="Toggle sidebar navigation">
        <mat-icon>menu</mat-icon>
      </button>

      <!-- Navbar Links -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <div class="d-flex align-items-center">
          <div class="btn-group dropstart">

            <button mat-icon-button data-bs-toggle="dropdown" aria-label="Open user menu">
              <img src="../assets/logo.png" alt="Profile Photo" class="rounded-circle" width="32" height="32">

            </button>
            <ul class="dropdown-menu text-left">

              <li><button mat-button class="dropdown-item" routerLink="/admin/profile"><i class="fa fa-user"></i> Profile</button></li>
